<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Shared Test</title>
<style>
  body { font-family: Arial; padding: 20px; background:#f5f5f5; }
  input { padding: 8px; width: 200px; }
  button { padding: 8px 12px; margin-left:5px; }
  ul { margin-top:20px; }
  li { padding:5px 0; }
</style>
</head>
<body>
<h2>Live Shared Input Test</h2>

<form id="msg-form">
  <input type="text" id="msg-input" placeholder="Type something" required>
  <button type="submit">Submit</button>
</form>

<h3>Messages:</h3>
<ul id="msg-list"></ul>

<script>
const form = document.getElementById('msg-form');
const input = document.getElementById('msg-input');
const list = document.getElementById('msg-list');

// CONFIG: replace with your bin ID and JSONBin secret key
const BIN_ID = "68d2ce58d0ea881f408821c8";
const SECRET_KEY = "$2a$10$27.n50NIBsSyg6csh0ypY.gOQC7KOend74JWLW6fbBZ34e.Fpxnw.";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// Submit message
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  // Get current messages
  const messages = await fetchMessages();

  // Add new message
  messages.push(text);

  // Update bin
  await fetch(API_URL, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': SECRET_KEY
    },
    body: JSON.stringify({messages})
  });

  input.value = '';
  renderMessages(messages);
});

// Fetch messages from jsonbin
async function fetchMessages() {
  try {
    const res = await fetch(API_URL + "/latest", {
      headers: {'X-Master-Key': SECRET_KEY}
    });
    const data = await res.json();
    return data.record.messages || [];
  } catch(err) {
    console.error(err);
    return [];
  }
}

// Render messages
function renderMessages(messages) {
  list.innerHTML = '';
  messages.forEach(msg => {
    const li = document.createElement('li');
    li.textContent = msg;
    list.appendChild(li);
  });
}

// Poll every 2 seconds for live updates
setInterval(async () => {
  const messages = await fetchMessages();
  renderMessages(messages);
}, 2000);

// Initial fetch
fetchMessages().then(renderMessages);
</script>
</body>
</html>
